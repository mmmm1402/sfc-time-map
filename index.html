    { id: 'gazo1', label: '1974–78', long: '1974–78年（カラー写真）', color: '#8a4a1b', ink: '#fff' },
    { id: 'gazo2', label: '1979–83', long: '1979–83年（カラー写真）', color: '#c2762a', ink: '#fff' },
    { id: 'gazo4', label: '1987–90', long: '1987–90年（カラー写真）', color: '#e0a83e', ink: '#2a1a05' },
    { id: 'seamlessphoto', label: '現在の写真', long: '現在の写真', color: '#215b85', ink: '#fff' },
    { id: 'std', label: '標準地図', long: '標準地図', color: '#386843', ink: '#fff' },
    { id: 'pale', label: '淡色地図', long: '淡色地図', color: '#596575', ink: '#fff' },
    { id: 'hillshademap', label: '陰影起伏図', long: '陰影起伏図', color: '#73508b', ink: '#fff' },
    { id: 'relief', label: '色別標高図', long: '色別標高図', color: '#a1395c', ink: '#fff' }
  ];
  SHAPE_ERAS = SHAPE_ERAS.concat(KJ_ERAS.map(function(e){
    return {id:e.id,label:e.label,long:e.full,color:e.color,ink:e.ink};
  }));

var SE=Object.create(null); SHAPE_ERAS.forEach(function(e){SE[e.id]=e;});
function pastel(hex){return '#'+hex.slice(1).match(/../g).map(function(c){return Math.round(parseInt(c,16)*.3+255*.7).toString(16).padStart(2,'0');}).join('');}
function h(tag,attrs,kids){var el=document.createElement(tag);Object.keys(attrs||{}).forEach(function(k){if(k==='text')el.textContent=attrs[k];else if(k in el)el[k]=attrs[k];else el.setAttribute(k,attrs[k]);});(kids||[]).forEach(function(c){el.append(c);});return el;}
var map=L.map(mapEl,{center:CENTER,zoom:16,minZoom:15,maxZoom:18,zoomAnimation:false,fadeAnimation:false,maxBounds:[[35.3845,139.4225],[35.3955,139.4355]],maxBoundsViscosity:1});
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution('出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院（地理院タイル）</a>');
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
var photoPane=map.createPane('photo');photoPane.style.zIndex='250';photoPane.style.pointerEvents='none';
var shapePane=map.createPane('shapes');shapePane.style.zIndex='400';
var labelPane=map.createPane('shapeLabels');labelPane.style.zIndex='450';
var shapes=work.shapes.filter(function(s){return !s.hidden;}), views=[];
var baseLayer,photoLayer;
function status(){var layers=[baseLayer,photoLayer].filter(function(l){return l&&map.hasLayer(l);});var failed=layers.some(function(l){return l.failed.size;});$('status').className=failed?'none':'';$('status').textContent=!layers.length?'形 '+shapes.length+'個を表示中':navigator.onLine===false?'オフライン：接続後に画像を再読み込みします':failed?'画像の一部を取得できません。再読み込みしてください':layers.some(function(l){return l.isLoading();})?'画像を読み込み中…':'形 '+shapes.length+'個を表示中';}
function track(layer){layer.failed=new Set();function key(e){return e.coords.z+'/'+e.coords.x+'/'+e.coords.y;}layer.on('loading load',status);layer.on('tileerror',function(e){layer.failed.add(key(e));status();});layer.on('tileload tileunload',function(e){layer.failed.delete(key(e));status();});return layer;}
var tile='https://cyberjapandata.gsi.go.jp/xyz/';
baseLayer=track(L.tileLayer(tile+'pale/{z}/{x}/{y}.png',{maxZoom:18,maxNativeZoom:18,keepBuffer:1}));
photoLayer=track(L.tileLayer(tile+'seamlessphoto/{z}/{x}/{y}.jpg',{pane:'photo',maxZoom:18,maxNativeZoom:18,keepBuffer:1}));
function popup(s){return h('div',{},[h('h3',{text:s.name||'名前なし'}),h('p',{text:SE[s.era].long}),h('p',{className:'shape-memo',text:s.memo||'メモはありません。'})]);}
function openShape(s,pos){L.popup().setLatLng(pos).setContent(popup(s)).openOn(map);}
shapes.forEach(function(s,i){var e=SE[s.era],color=pastel(e.color);
var polygon=L.polygon(s.pts,{pane:'shapes',color:e.color,weight:1,fillColor:color,fillOpacity:.65,interactive:true,bubblingMouseEvents:false}).addTo(map);
polygon.on('click',function(ev){openShape(s,ev.latlng);});
var box=h('div',{className:'in'},[h('b',{className:'nm',text:s.name||'名前なし'}),h('div',{className:'er',text:e.label})]);box.style.borderColor=e.color;
var pos=s.lab||polygon.getBounds().getCenter();var label=L.marker(pos,{pane:'shapeLabels',icon:L.divIcon({className:'shapeLab',html:box,iconSize:null}),keyboard:true,title:s.name,alt:s.name}).addTo(map);label.on('click',function(){openShape(s,pos);});
views.push({polygon:polygon,label:label});
var swatch=h('span',{className:'swatch','aria-hidden':'true'});swatch.style.borderColor=e.color;swatch.style.background=color;
var item=h('button',{type:'button',className:'legend-item'},[swatch,h('span',{},[h('strong',{text:(i+1)+'. '+(s.name||'名前なし')}),h('small',{text:e.long})])]);item.onclick=function(){map.fitBounds(polygon.getBounds(),{padding:[35,35],maxZoom:17,animate:false});openShape(s,pos);};$('legend').append(item);
});
var handle=$('swipe');$('lblL').textContent='標準地図（淡色）';$('lblR').textContent='最新の空中写真';
function applyClip(){if(mode!=='swipe'){photoPane.style.clipPath='';return;}var size=map.getSize(),nw=map.containerPointToLayerPoint([0,0]),se=map.containerPointToLayerPoint(size),x=nw.x+size.x*swipe;photoPane.style.clipPath='polygon('+x+'px '+nw.y+'px,'+se.x+'px '+nw.y+'px,'+se.x+'px '+se.y+'px,'+x+'px '+se.y+'px)';handle.style.left=size.x*swipe+'px';handle.setAttribute('aria-valuenow',String(Math.round(swipe*100)));}
function setMode(next){if(!['color','map','swipe'].includes(next))return;mode=next;map.closePopup();$('modes').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mode===mode));});
if(mode==='color'){if(map.hasLayer(baseLayer))map.removeLayer(baseLayer);}else if(!map.hasLayer(baseLayer))baseLayer.addTo(map);
if(mode==='swipe'){if(!map.hasLayer(photoLayer))photoLayer.addTo(map);}else if(map.hasLayer(photoLayer))map.removeLayer(photoLayer);
views.forEach(function(v){v.polygon.setStyle({weight:mode==='swipe'?1:1.2,fill:mode!=='swipe',fillOpacity:mode==='color'?1:.65});if(mode==='swipe'){if(map.hasLayer(v.label))map.removeLayer(v.label);}else if(!map.hasLayer(v.label))v.label.addTo(map);});
handle.hidden=$('lblL').hidden=$('lblR').hidden=mode!=='swipe';$('reload').hidden=mode==='color';applyClip();status();}
$('modes').querySelectorAll('button').forEach(function(b){b.onclick=function(){setMode(b.dataset.mode);};});
(function(){var dragging=false;function update(ev){var r=mapEl.getBoundingClientRect();swipe=Math.min(.97,Math.max(.03,(ev.clientX-r.left)/r.width));applyClip();}handle.addEventListener('pointerdown',function(ev){if(ev.isPrimary===false||ev.button!==0)return;dragging=true;handle.setPointerCapture(ev.pointerId);ev.preventDefault();update(ev);});handle.addEventListener('pointermove',function(ev){if(dragging)update(ev);});['pointerup','pointercancel','lostpointercapture'].forEach(function(type){handle.addEventListener(type,function(){dragging=false;});});handle.addEventListener('keydown',function(ev){if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'||ev.key==='Home'||ev.key==='End'){swipe=ev.key==='Home'?.03:ev.key==='End'?.97:Math.min(.97,Math.max(.03,swipe+(ev.key==='ArrowLeft'?-.03:.03)));applyClip();ev.preventDefault();ev.stopPropagation();}});})();
function resizeAll(){map.invalidateSize({pan:false,animate:false});applyClip();}
function home(){resizeAll();if(shapes.length)map.fitBounds(shapes.flatMap(function(s){return s.pts;}),{padding:[35,35],maxZoom:17,animate:false});else map.setView(CENTER,16);}
function reload(){[baseLayer,photoLayer].forEach(function(l){if(map.hasLayer(l)){l.failed.clear();l.redraw();}});status();}
$('home').onclick=home;$('reload').onclick=reload;
map.on('move zoom zoomend moveend resize viewreset',applyClip);
if(window.ResizeObserver)new ResizeObserver(resizeAll).observe(mapEl);else window.addEventListener('resize',resizeAll);
window.addEventListener('online',reload);window.addEventListener('offline',status);
setMode('map');home();
})();
