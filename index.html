<html lang="ja"><head><meta charset="utf-8">

<title>SFC 地形の名残の地図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>  :root {
    --ink: #1d2733; --sub: #5a6675; --line: #d5dbe3; --bg: #f6f4ef; --card: #ffffff;
    --accent: #b4532a; --accent-ink: #ffffff; --soft: #f1e4da; --ok: #2f7d4f; --warn: #a15c00;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.5;
    display: grid; grid-template-rows: auto minmax(42vh, 1fr) auto; grid-template-areas: "head" "map" "dock";
    height: 100vh; height: 100dvh; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- header ---------- */
  header { grid-area: head; padding: 8px 10px 6px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--card); border-bottom: 1px solid var(--line); }
  .title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .title h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .title small { color: var(--sub); font-size: 11px; }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .modes button {
    min-height: 46px; border: 1px solid var(--line); background: #fff; border-radius: 10px;
    font-weight: 600; font-size: 14px; padding: 4px 2px; line-height: 1.2;
  }
  .modes button span { display: block; font-size: 10px; font-weight: 400; color: var(--sub); }
  .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .modes button[aria-pressed="true"] span { color: #ffe9dc; }

  .layer-picker { margin: 8px 0; min-width: 0; }
  .layer-group { min-width: 0; margin: 8px 0; padding: 8px; border: 1px solid var(--line); border-radius: 10px; }
  .layer-group legend { font-size: 12px; font-weight: 700; padding: 0 4px; }
  .layer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .layer-grid .chip { min-width: 0; padding: 8px 4px; border-radius: 8px; font-size: 13px; overflow-wrap: anywhere; }
  .layer-grid .chip[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--ink); }
  .panel-heading { margin: 14px 0 6px; font-size: 13px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- map ---------- */
  #mapwrap { grid-area: map; position: relative; min-height: 0; overflow: hidden; }
  #map {
    position: absolute; inset: 0; z-index: 0; touch-action: none;
    /* 画像が無い所は斜線の地が見える */
    background: repeating-linear-gradient(45deg, #e6e2d8 0 10px, #dcd7ca 10px 20px);
  }
  .leaflet-container { font: inherit; }
  .leaflet-control-attribution { font-size: 11px; background: rgba(255,255,255,.88) !important; }
  #status {
    position: absolute; z-index: 600; top: 8px; left: 50%; transform: translateX(-50%);
    max-width: calc(100% - 110px); background: rgba(29,39,51,.86); color: #fff; border-radius: 999px;
    padding: 4px 12px; font-size: 12px; pointer-events: none; text-align: center;
  }
  #status b { font-weight: 700; }
  #status.none { background: rgba(161,92,0,.94); }
  #home {
    position: absolute; z-index: 600; right: 10px; top: 8px; min-height: 40px; padding: 0 10px;
    border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 12px; font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  #lensRing {
    position: absolute; z-index: 500; pointer-events: none; border-radius: 50%;
    border: 3px solid var(--accent); box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 4px 18px rgba(0,0,0,.35);
    transform: translate(-50%, -50%);
  }
  #lensRing span {
    position: absolute; left: 50%; top: 100%; transform: translate(-50%, 6px); white-space: nowrap;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
  }
  #swipe {
    position: absolute; z-index: 500; top: 0; bottom: 0; width: 48px; margin-left: -24px;
    cursor: ew-resize; touch-action: none;
  }
  #swipe::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 4px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  #swipe .grip {
    position: absolute; left: 0; top: 50%; width: 48px; height: 48px; margin-top: -24px; border-radius: 50%;
    background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 700;
    border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .sideLabel {
    position: absolute; z-index: 499; top: 44px; pointer-events: none; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px;
  }
  #lblL { left: 54px; } #lblR { right: 10px; }

  /* ---------- dock ---------- */
  #dock {
    grid-area: dock; background: var(--card); border-top: 1px solid var(--line); overflow-y: auto; max-height: 44vh; max-height: 44dvh;
    padding: 8px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .lbl { font-size: 11px; color: var(--sub); font-weight: 700; flex: none; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; -webkit-overflow-scrolling: touch; }
  .chip {
    flex: none; min-height: 44px; padding: 4px 12px; border: 1px solid var(--line); background: #fff; border-radius: 999px;
    font-weight: 700; font-size: 14px; line-height: 1.15; text-align: center;
  }
  .chip small { display: block; font-weight: 400; font-size: 10px; color: var(--sub); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip[aria-pressed="true"] small { color: #cdd6e0; }
  .chip.nodata { border-style: dashed; color: #8a93a0; }
  .btn {
    min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-weight: 600; font-size: 14px;
  }
  .btn.on, .btn[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { min-height: 38px; font-size: 13px; padding: 0 10px; }
  input[type=range] { flex: 1 1 140px; min-width: 120px; height: 36px; accent-color: var(--accent); }
  .val { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--sub); min-width: 3.5em; text-align: right; }
  #caption { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fbfaf7; margin: 4px 0 6px; }
  #caption h2 { font-size: 15px; margin: 0 0 2px; }
  #caption p { margin: 2px 0; font-size: 13px; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 4px; vertical-align: 1px; border: 1px solid; }
  .tag.est { color: var(--warn); border-color: var(--warn); background: #fff6e6; }
  .tag.unk { color: #6b4fa0; border-color: #6b4fa0; background: #f3eefb; }
  .tag.chk { color: var(--ok); border-color: var(--ok); background: #ebf6ef; }
  .tag.good { color: var(--accent); border-color: var(--accent); background: var(--soft); }
  .foot { font-size: 11px; color: var(--sub); margin: 8px 0 0; }
  .foot a { color: inherit; }
  details.help summary { font-size: 12px; color: var(--sub); cursor: pointer; padding: 6px 0; }
  details.help ul { margin: 0 0 6px; padding-left: 1.2em; font-size: 12px; color: var(--sub); }

  .shapeLab { background: none; border: 0; }
  .shapeLab .in {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); white-space: nowrap; cursor: grab;
    display: flex; flex-direction: column; align-items: center; gap: 1px; width: max-content; background: rgba(255,255,255,.93); border: 1.5px solid var(--c, #555);
    border-radius: 999px; padding: 4px 10px; line-height: 1.3; font-size: 12px; font-weight: 700; color: #1d2733;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .shapeLab .nm { white-space: nowrap; }
  .shapeLab .er { white-space: nowrap; font-weight: 400; font-size: 10px; color: #444; }
  .noshapelabels .shapeLab .nm, .noshapelabels .shapeLab .er { display: none; }
  .noshapelabels .shapeLab .in { padding: 1px 2px; }

  body { grid-template-rows: auto minmax(0,1fr) minmax(0,38dvh); }
  header { max-height: 29dvh; overflow:auto; }
  #dock { max-height:none; min-width:0; }
  h1, p, .legend-item { overflow-wrap:anywhere; }
  #rule { margin:4px 0; font-size:13px; }
  #instructions { margin:4px 0; font-size:12px; color:var(--sub); }
  .modes { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .modes button { overflow-wrap:anywhere; }
  select { width:100%; min-width:0; min-height:44px; border:1px solid var(--line); border-radius:8px; background:white; padding:6px; }
  .legend-item { display:flex; align-items:center; gap:8px; text-align:left; width:100%; margin:6px 0; padding:8px; background:white; border:1px solid var(--line); border-radius:8px; min-height:44px; }
  .swatch { flex:none; width:18px; height:18px; border:3px solid; border-radius:3px; }
  .legend-item small { display:block; color:var(--sub); }
  .shapeLab .in { cursor:pointer; max-width:220px; }
  .shapeLab .nm { white-space:normal; overflow-wrap:anywhere; }
  .leaflet-popup-content { max-width: min(260px,65vw); overflow-wrap:anywhere; }
  .shape-memo { white-space:pre-wrap; }
  #fatal { position:absolute; inset:0; z-index:900; padding:24px; display:grid; place-content:center; background:var(--bg); text-align:center; }
  #home { right:max(10px,env(safe-area-inset-right)); }
  .leaflet-right { right:env(safe-area-inset-right); }
  .leaflet-left { left:env(safe-area-inset-left); }
  button,select,input { min-height:24px; }
  @media(pointer:coarse) { button,select,input { min-height:44px; } .leaflet-control-zoom a { width:44px; height:44px; line-height:44px; } .leaflet-popup-close-button { min-width:44px; min-height:44px; } }
  @media(min-width:900px) {
    body { grid-template-columns:360px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); grid-template-areas:"head map" "dock map"; }
    header { max-height:36dvh; border-right:1px solid var(--line); }
    #dock { border-right:1px solid var(--line); }
  }
</style></head><body>
<header><div class="title"><h1 id="title"></h1><small>閲覧用</small></div>
<p id="rule"></p><p id="instructions">ドラッグで移動／スワイプやレンズで今と昔を比べられます。形や凡例を押すとメモが読めます。</p>
<div class="modes" id="modes" aria-label="比較の表示方法">
<button type="button" data-mode="timeline">全面<span>レイヤーを見る</span></button>
<button type="button" data-mode="swipe">スワイプ<span>左右で比較</span></button>
<button type="button" data-mode="lens">レンズ<span>窓で比較</span></button>
<button type="button" data-mode="blend">重ねる<span>透かして比較</span></button></div></header>
<main id="mapwrap" aria-label="時代の地図"><div id="map"></div>
<div id="status" role="status"></div><button type="button" id="home">全体に戻る</button>
<div id="lensRing" hidden><span id="lensLabel"></span></div>
<div id="swipe" hidden role="slider" tabindex="0" aria-label="比較の境界を左右に移動" aria-valuemin="3" aria-valuemax="97" aria-valuenow="50" aria-orientation="horizontal"><div class="grip">↔</div></div>
<div id="lblL" class="sideLabel" hidden></div><div id="lblR" class="sideLabel" hidden></div>
<div id="fatal" hidden>地図ライブラリを読み込めませんでした。インターネット接続を確認して、このページを開き直してください。</div></main>
<aside id="dock" aria-label="レイヤーと凡例">
<label class="field" for="eraSelect">比較するレイヤー</label><select id="eraSelect"></select>
<div id="ctlBase"><label for="baseSelect">土台レイヤー（比較の相手）</label><select id="baseSelect"></select></div>
<div id="ctlLens" hidden><div class="row"><label for="lensR">レンズの半径</label><input type="range" id="lensR" min="40" max="260" step="5"><output id="lensRVal" for="lensR"></output></div><div class="row"><span>指で動かすのは</span><button type="button" class="btn" id="grabLens">レンズ</button><button type="button" class="btn" id="grabMap">地図</button></div><p class="hint">マウスではレンズが追従。地図をタップしてもレンズを移せます。</p></div>
<div id="ctlSwipe" class="row" hidden><button type="button" class="btn" id="swapSides">⇄ 左右を入れ替える</button><span class="hint">丸い境界を左右に動かす</span></div>
<div id="ctlBlend" hidden><div class="row"><label for="opacity">重ねる濃さ</label><input type="range" id="opacity" min="0" max="100"><output id="opacityVal" for="opacity"></output></div><button type="button" class="btn" id="multiply">乗算で重ねる</button></div>
<h2 class="panel-heading">凡例</h2><div id="legend"></div>
<p class="foot" id="credit"></p><p class="foot">出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院（地理院タイル）</a>／<a href="https://ktgis.net/kjmapw/" target="_blank" rel="noopener">今昔マップ on the web</a><br>年代は各レイヤーの収録期間です。画像の表示には通信が必要です。</p>
<button type="button" class="btn" id="reload">画像を再読み込み</button>
</aside>

    var mpp = OFFSET_MPP17 * Math.pow(2,17-zoom);
    return {dx:o.dx/mpp,dy:o.dy/mpp};
  }
  // Each destination tile samples all intersecting source tiles. No container
  // translation: pane clips, polygon vertices and viewport edges stay fixed.
  var PhotoLayer = L.TileLayer.extend({
    createTile: function(coords, done) {
      var canvas = document.createElement('canvas'), size = this.getTileSize();
      canvas.width = size.x; canvas.height = size.y;
      var ctx = canvas.getContext('2d'), o = offsetPixels(this.options.photoEra,coords.z);
      var left = coords.x*size.x-o.dx, top = coords.y*size.y-o.dy;
      var x0=Math.floor(left/size.x), x1=Math.ceil((left+size.x)/size.x)-1;
      var y0=Math.floor(top/size.y), y1=Math.ceil((top+size.y)/size.y)-1;
      var pending=(x1-x0+1)*(y1-y0+1), failure=null, layer=this;
      function finish(error) { if(error)failure=error; if(--pending===0)done(failure,canvas); }
      for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++)(function(tx,ty){
        var n=Math.pow(2,coords.z);
        if(ty<0 || ty>=n){finish(new Error('写真の範囲外'));return;}
        var source=L.point(((tx%n)+n)%n,ty);source.z=coords.z;
        var img=new Image();
        img.onload=function(){ctx.drawImage(img,tx*size.x-left,ty*size.y-top,size.x,size.y);finish(null);};
        img.onerror=function(){finish(new Error('写真タイルを取得できません'));};
        var era=ERA[layer.options.photoEra];
        if(era.konjak){
          // キャンバス取得：南西原点TMSなのでXYZのyを自分で反転する。
          var y_tms=(Math.pow(2,source.z)-1)-source.y;
          img.crossOrigin='anonymous';
          img.src=KJ_TILE.replace('{period}',era.period).replace('{z}',source.z).replace('{x}',source.x).replace('{-y}',y_tms);
        }else img.src=layer.getTileUrl(source);
      })(x,y);
      return canvas;
    }
  });
  function makeLayer(e, pane) {
    // LeafletはmaxNativeZoomで元タイルのズームを制限し、切り抜き内でも拡大する。
    var Layer = e.konjak || (e.time && e.id!=='seamlessphoto') ? PhotoLayer : L.TileLayer;
    // Leaflet表示経路：{-y} がXYZのyをTMSのyへ反転する。
    var url=e.konjak ? KJ_TILE.replace('{period}',e.period) : TILE.replace('{id}',e.id).replace('{ext}',e.ext);
    return new Layer(url, {
      pane: pane, minZoom: e.minZoom || 5, crossOrigin: e.konjak ? 'anonymous' : false, maxZoom: 18, maxNativeZoom: e.maxNative, keepBuffer: 1, photoEra:e.id
    });
  }

  map.attributionControl.addAttribution(KJ_ATTR);
  var baseLayer=null,eraLayer=null,shapeViews=[];
  var ring=$('lensRing'),handle=$('swipe'),lblL=$('lblL'),lblR=$('lblR');
  var lensLL=L.latLng(CENTER);
  function h(tag,attrs,kids){var el=document.createElement(tag);Object.keys(attrs||{}).forEach(function(k){if(k==='text')el.textContent=attrs[k];else if(k in el)el[k]=attrs[k];else el.setAttribute(k,attrs[k]);});(kids||[]).forEach(function(c){el.append(c);});return el;}
  function status(){
    var layers=[baseLayer,eraLayer].concat(shapeViews.map(function(v){return v.layer;})).filter(Boolean);
    var failed=layers.some(function(l){return l.failed && l.failed.size;});
    $('status').className=failed?'none':'';
    $('status').textContent=navigator.onLine===false?'オフライン：接続後に画像を再読み込みします':failed?'画像の一部を取得できません。斜線部分は欠損です':layers.some(function(l){return l.isLoading();})?'画像を読み込み中…':'形 '+S.shapes.filter(function(s){return !s.hidden;}).length+'個を表示中';
  }
  function track(layer){layer.failed=new Set();function key(e){return e.coords.z+'/'+e.coords.x+'/'+e.coords.y;}layer.on('loading load',status);layer.on('tileerror',function(e){layer.failed.add(key(e));status();});layer.on('tileload tileunload',function(e){layer.failed.delete(key(e));status();});return layer;}
  function setBase(id){if(!ERA[id])return;S.base=id;if(baseLayer)map.removeLayer(baseLayer);baseLayer=track(makeLayer(ERA[id],'tilePane')).addTo(map);$('baseSelect').value=id;updateLabels();status();}
  function setEra(id){if(!ERA[id])return;S.era=id;if(eraLayer)map.removeLayer(eraLayer);eraLayer=track(makeLayer(ERA[id],'era')).addTo(map);$('eraSelect').value=id;updateLabels();applyClip();status();}
  function setClip(v) { eraPane.style.clipPath = v; eraPane.style.webkitClipPath = v; }
  function applyClip() {
    var size = map.getSize();
    if (S.mode === 'lens') {
      var c = map.latLngToLayerPoint(lensLL), cc = map.latLngToContainerPoint(lensLL);
      setClip('circle(' + S.lensR + 'px at ' + c.x + 'px ' + c.y + 'px)');
      ring.style.left = cc.x + 'px'; ring.style.top = cc.y + 'px';
      ring.style.width = ring.style.height = (S.lensR * 2) + 'px';
    } else if (S.mode === 'swipe') {
      var nw = map.containerPointToLayerPoint([0, 0]), se = map.containerPointToLayerPoint(size);
      var sx = nw.x + size.x * S.swipe;
      var x1 = S.swap ? sx : nw.x, x2 = S.swap ? se.x : sx;
      setClip('polygon(' + x1 + 'px ' + nw.y + 'px,' + x2 + 'px ' + nw.y + 'px,' + x2 + 'px ' + se.y + 'px,' + x1 + 'px ' + se.y + 'px)');
      handle.style.left = (size.x * S.swipe) + 'px';
      handle.setAttribute('aria-valuenow', String(Math.round(S.swipe * 100)));
    } else {
      setClip('');
    }
  }
  map.on('move zoom zoomend moveend resize viewreset', applyClip);

  function updateLabels() {
    var e = ERA[S.era], b = ERA[S.base];
    $('lensLabel').textContent = e.label;
    var oldTxt = '比較：' + e.label, nowTxt = '土台：' + b.label;
    lblL.textContent = S.swap ? nowTxt : oldTxt;
    lblR.textContent = S.swap ? oldTxt : nowTxt;
  }


  function setMode(m){
    S.mode=m;
    $('modes').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mode===m));});
    eraPane.style.opacity=m==='blend'?String(S.opacity):'1';
    eraPane.style.mixBlendMode=m==='blend'&&S.multiply?'multiply':'';
    basePane.style.visibility=m==='timeline'?'hidden':'';
    ring.hidden=m!=='lens';handle.hidden=m!=='swipe';lblL.hidden=lblR.hidden=m!=='swipe';
    $('ctlLens').hidden=m!=='lens';$('ctlSwipe').hidden=m!=='swipe';$('ctlBlend').hidden=m!=='blend';$('ctlBase').hidden=m==='timeline';
    applyGrab();applyClip();requestAnimationFrame(resizeAll);
  }
  function applyGrab(){var lock=S.mode==='lens'&&S.lensGrab;if(lock)map.dragging.disable();else map.dragging.enable();$('grabLens').setAttribute('aria-pressed',String(!!S.lensGrab));$('grabMap').setAttribute('aria-pressed',String(!S.lensGrab));}
  function moveLens(ev){var r=mapEl.getBoundingClientRect(),y=ev.clientY-r.top;if(ev.pointerType&&ev.pointerType!=='mouse')y-=S.lensR*.5;lensLL=map.containerPointToLatLng([ev.clientX-r.left,y]);applyClip();}
  function follows(ev){return S.mode==='lens'&&(ev.pointerType==='mouse'||S.lensGrab)&&!(ev.target.closest&&ev.target.closest('.leaflet-control,.leaflet-popup,.shapeLab'));}
  mapEl.addEventListener('pointermove',function(ev){if(follows(ev)&&ev.isPrimary!==false)moveLens(ev);});
  mapEl.addEventListener('pointerdown',function(ev){if(follows(ev)&&ev.isPrimary!==false)moveLens(ev);});
  map.on('click',function(ev){if(S.mode==='lens'){lensLL=ev.latlng;applyClip();}});
  (function(){var dragging=false;function upd(ev){var r=mapEl.getBoundingClientRect();S.swipe=Math.min(.97,Math.max(.03,(ev.clientX-r.left)/r.width));applyClip();}
    handle.addEventListener('pointerdown',function(ev){dragging=true;handle.setPointerCapture(ev.pointerId);ev.preventDefault();upd(ev);});handle.addEventListener('pointermove',function(ev){if(dragging)upd(ev);});
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(type){handle.addEventListener(type,function(){dragging=false;});});
    handle.addEventListener('keydown',function(ev){if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){S.swipe=Math.min(.97,Math.max(.03,S.swipe+(ev.key==='ArrowLeft'?-.03:.03)));applyClip();ev.preventDefault();ev.stopPropagation();}});
  })();
  var LAYER_GROUPS=[{title:'昔の写真（4種）',layers:ERAS.slice(0,4)},{title:'いまの地図・写真（5種）',layers:ERAS.slice(4,9)},{title:'昔の地形図（9種）',layers:KJ_ERAS}];
  ['eraSelect','baseSelect'].forEach(function(id){LAYER_GROUPS.forEach(function(group){var opt=h('optgroup',{label:group.title});group.layers.forEach(function(e){opt.append(h('option',{value:e.id,text:e.full}));});$(id).append(opt);});});
  $('eraSelect').onchange=function(){setEra(this.value);};$('baseSelect').onchange=function(){setBase(this.value);};
  $('modes').querySelectorAll('button').forEach(function(b){b.onclick=function(){setMode(b.dataset.mode);};});
  $('lensR').value=S.lensR;$('lensRVal').textContent=S.lensR+'px';
  $('lensR').oninput=function(){S.lensR=+this.value;$('lensRVal').textContent=S.lensR+'px';applyClip();};
  $('grabLens').onclick=function(){S.lensGrab=true;applyGrab();};$('grabMap').onclick=function(){S.lensGrab=false;applyGrab();};
  $('swapSides').onclick=function(){S.swap=!S.swap;updateLabels();applyClip();};
  $('opacity').value=Math.round(S.opacity*100);$('opacityVal').textContent=$('opacity').value+'%';
  $('opacity').oninput=function(){S.opacity=+this.value/100;$('opacityVal').textContent=this.value+'%';setMode(S.mode);};
  $('multiply').setAttribute('aria-pressed',String(!!S.multiply));$('multiply').onclick=function(){S.multiply=!S.multiply;this.setAttribute('aria-pressed',String(S.multiply));setMode(S.mode);};
  function updateShapeClips() {
    shapeViews.forEach(function(v){
      var coords=v.s.pts.map(function(p){return map.latLngToLayerPoint(p);});
      var poly='polygon('+coords.map(function(q){return q.x+'px '+q.y+'px';}).join(',')+')';
      var xs=coords.map(function(p){return p.x;}),ys=coords.map(function(p){return p.y;});
      Object.assign(v.hatch.style,{left:Math.min.apply(null,xs)+'px',top:Math.min.apply(null,ys)+'px',width:(Math.max.apply(null,xs)-Math.min.apply(null,xs))+'px',height:(Math.max.apply(null,ys)-Math.min.apply(null,ys))+'px'});
      v.pane.style.clipPath=poly; v.pane.style.webkitClipPath=poly;
      v.pane.style.width=map.getSize().x+'px'; v.pane.style.height=map.getSize().y+'px';
    });
  }
  map.on('move zoom moveend zoomend viewreset resize',updateShapeClips);
  function labelIcon(s,i) {
    var e=SE[s.era],box=h('div',{className:'in'});
    box.style.borderColor=e.color;
    if(S.shapeLabels==='number')box.append(h('b',{text:String(i+1)}));
    else box.append(h('b',{className:'nm',text:s.name||'名前なし'}),h('div',{className:'er',text:e.label}));
    return L.divIcon({className:'shapeLab',html:box,iconSize:null});
  }

  function popup(s){return h('div',{},[h('h3',{text:s.name||'名前なし'}),h('p',{text:SE[s.era].long}),h('p',{className:'shape-memo',text:s.memo||'メモはありません。'})]);}
  function openShape(s,pos){L.popup().setLatLng(pos).setContent(popup(s)).openOn(map);}
  function renderShapes(){
    S.shapes.forEach(function(s,i){
      if(s.hidden)return;
      var pn='shape_'+s.id,group=map.createPane(pn+'_group');group.style.zIndex=String(260+i);group.style.pointerEvents='none';
      var pane=map.createPane(pn,group),frame=map.createPane(pn+'_frame',group),labelPane=map.createPane(pn+'_label',group);pane.style.zIndex='0';frame.style.zIndex='1';labelPane.style.zIndex='2';pane.style.pointerEvents='none';
      var hatch=h('div');Object.assign(hatch.style,{position:'absolute',zIndex:'0',background:'repeating-linear-gradient(45deg,#ddd 0 8px,#aaa 8px 16px)'});pane.append(hatch);
      var v={s:s,pane:pane,hatch:hatch};v.layer=track(makeLayer(ERA[s.era],pn));
      // 透明の塗りをヒット領域にして、輪郭だけでなく形の内部からもメモを開ける。
      v.outline=L.polygon(s.pts,{pane:pn+'_frame',color:SE[s.era].color,weight:3,fill:true,fillOpacity:0,interactive:true,bubblingMouseEvents:false}).addTo(map);
      v.outline.on('click',function(ev){openShape(s,ev.latlng);});
      var pos=s.lab||v.outline.getBounds().getCenter();
      if(S.shapeLabels!==false&&S.shapeLabels!=='none'){
        v.label=L.marker(pos,{pane:pn+'_label',icon:labelIcon(s,i),draggable:false,keyboard:true,title:s.name,alt:s.name}).addTo(map);
        v.label.on('click',function(){openShape(s,pos);});
      }
      shapeViews.push(v);updateShapeClips();v.layer.addTo(map);
      var swatch=h('span',{className:'swatch','aria-hidden':'true'});swatch.style.borderColor=SE[s.era].color;
      var item=h('button',{type:'button',className:'legend-item'},[swatch,h('span',{},[h('strong',{text:(i+1)+'. '+(s.name||'名前なし')}),h('small',{text:SE[s.era].long})])]);
      item.onclick=function(){map.fitBounds(v.outline.getBounds(),{padding:[35,35],maxZoom:17,animate:false});openShape(s,pos);};$('legend').append(item);
    });
  }
  function resizeAll(){map.invalidateSize({pan:false,animate:false});applyClip();updateShapeClips();}
  function home(){resizeAll();var shapes=S.shapes.filter(function(s){return !s.hidden;});if(shapes.length)map.fitBounds(shapes.flatMap(function(s){return s.pts;}),{padding:[35,35],maxZoom:17,animate:false});else map.setView(CENTER,homeZoom());}
  function reloadVisiblePhotos(){if(eraLayer)eraLayer.redraw();if(baseLayer)baseLayer.redraw();shapeViews.forEach(function(v){v.layer.redraw();});updateShapeClips();status();}
  $('home').onclick=home;$('reload').onclick=reloadVisiblePhotos;
  setBase(S.base);setEra(S.era);renderShapes();setMode(S.mode);home();
  if(window.ResizeObserver)new ResizeObserver(resizeAll).observe(mapEl);else window.addEventListener('resize',resizeAll);
  map.on('moveend',reloadVisiblePhotos);
  window.addEventListener('online',reloadVisiblePhotos);window.addEventListener('offline',status);
})();
</script></body></html>
